[package]
name = "ldk-sample"
version = "0.1.0"
authors = ["Valentine Wallace <vwallace@protonmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lightning = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed", features = ["dnssec"] }
lightning-block-sync = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed", features = [ "rpc-client", "tokio" ] }
lightning-dns-resolver = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed" }
lightning-invoice = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed" }
lightning-net-tokio = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed" }
lightning-persister = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed" }
lightning-background-processor = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed", features = ["futures"]}
lightning-rapid-gossip-sync = { git = "https://github.com/a-mpch/rust-lightning", branch = "2025-06-cherry-pick-exposed" }


base64 = "0.22"
bitcoin = "0.32"
bitcoin-bech32 = "0.13"
bech32 = "0.11"
libc = "0.2"
log = "0.4.17"
tempfile = "3.5.0"

chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9.2"
serde_json = { version = "1.0" }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "net",
  "time",
] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
